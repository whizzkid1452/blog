name: EC2 수동 검증 배포

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-ec2-validation
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  AWS_ROLE_ARN: arn:aws:iam::424503481518:role/blog-ec2-deploy-role
  ECR_REPOSITORY: blog
  NEXT_PUBLIC_SITE_URL: https://devlog.dropai.site

jobs:
  deploy:
    name: ARM64 이미지 빌드 및 EC2 검증 배포
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: AWS 임시 자격 증명 설정
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          role-session-name: blog-ec2-validation
          aws-region: ${{ env.AWS_REGION }}

      - name: Amazon ECR 로그인
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: ARM64 에뮬레이션 설정
        uses: docker/setup-qemu-action@v3

      - name: Docker Buildx 설정
        uses: docker/setup-buildx-action@v3

      - name: ARM64 Docker 이미지 빌드 및 푸시
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}-arm64
        run: |
          set -euo pipefail
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          EXISTING_IMAGE_TAG="$(aws ecr batch-get-image \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids "imageTag=$IMAGE_TAG" \
            --query 'images[0].imageId.imageTag' \
            --output text)"

          if [[ "$EXISTING_IMAGE_TAG" == "$IMAGE_TAG" ]]; then
            # ECR 태그는 변경할 수 없으므로 재배포에서는 이미 검증된 동일 이미지를 사용한다.
            echo "ECR 이미지가 이미 존재하므로 빌드를 생략합니다."
          else
            # ECS의 AMD64 이미지와 충돌하지 않도록 아키텍처가 명시된 태그로 빌드한다.
            docker buildx build \
              --platform linux/arm64 \
              --build-arg "NEXT_PUBLIC_SITE_URL=$NEXT_PUBLIC_SITE_URL" \
              --tag "$IMAGE_URI" \
              --push \
              .
          fi
          echo "image=$IMAGE_URI" >> "$GITHUB_OUTPUT"

      - name: Systems Manager로 EC2 배포
        env:
          IMAGE_URI: ${{ steps.build-image.outputs.image }}
        run: |
          set -euo pipefail

          INSTANCE_IDS="$(aws ec2 describe-instances \
            --filters \
              Name=tag:Application,Values=blog \
              Name=instance-state-name,Values=running \
            --query 'Reservations[].Instances[].InstanceId' \
            --output text)"

          read -r -a INSTANCE_ID_LIST <<< "$INSTANCE_IDS"
          if [[ "${#INSTANCE_ID_LIST[@]}" -ne 1 ]]; then
            echo "실행 중인 blog EC2 인스턴스가 정확히 1개여야 합니다: $INSTANCE_IDS" >&2
            exit 1
          fi

          INSTANCE_ID="${INSTANCE_ID_LIST[0]}"
          DEPLOY_SCRIPT_BASE64="$(base64 --wrap=0 infra/deploy-ec2.sh)"
          SSM_PARAMETERS="$(jq --compact-output --null-input \
            --arg script "$DEPLOY_SCRIPT_BASE64" \
            --arg image "$IMAGE_URI" \
            --arg region "$AWS_REGION" \
            '{commands: [
              "echo \($script) | base64 --decode > /tmp/deploy-blog.sh",
              "chmod +x /tmp/deploy-blog.sh",
              "/tmp/deploy-blog.sh \($image) \($region)"
            ]}')"

          COMMAND_ID="$(aws ssm send-command \
            --document-name AWS-RunShellScript \
            --instance-ids "$INSTANCE_ID" \
            --parameters "$SSM_PARAMETERS" \
            --comment "blog $GITHUB_SHA 배포" \
            --query 'Command.CommandId' \
            --output text)"

          if ! aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID"; then
            aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID"
            exit 1
          fi

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}'
