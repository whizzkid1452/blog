AWSTemplateFormatVersion: '2010-09-09'
Description: 블로그 배포에서 공통으로 사용하는 ECR 저장소와 GitHub OIDC 공급자

Resources:
  # 기존 blog-ecs 스택을 업데이트할 때 물리 리소스를 유지하려면 이 논리 ID를 변경하면 안 된다.
  ContainerRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: blog
      ImageScanningConfiguration:
        ScanOnPush: true
      ImageTagMutability: IMMUTABLE
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "최근 이미지 20개 유지",
                "selection": {
                  "tagStatus": "any",
                  "countType": "imageCountMoreThan",
                  "countNumber": 20
                },
                "action": {
                  "type": "expire"
                }
              }
            ]
          }

  # EC2 배포 역할의 신뢰 정책이 이 공급자 ARN을 참조하므로 기존 논리 ID를 유지한다.
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com

Outputs:
  ContainerRepositoryUri:
    Value: !GetAtt ContainerRepository.RepositoryUri
  GitHubOidcProviderArn:
    Value: !Ref GitHubOidcProvider
