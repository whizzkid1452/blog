version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 22
        - nvm use 22
        - corepack enable
        - corepack prepare pnpm@11.9.0 --activate
        - pnpm install --frozen-lockfile
    build:
      commands:
        - 'export NEXT_PUBLIC_SITE_URL="${NEXT_PUBLIC_SITE_URL:-https://${AWS_BRANCH}.${AWS_APP_ID}.amplifyapp.com}"'
        - pnpm build
  artifacts:
    baseDirectory: out
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
